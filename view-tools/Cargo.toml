[package]
name = "zkas-view-tools"
version = "0.1.0"
edition = "2021"
license = "ISC"
[lib]
crate-type = ["cdylib"]

[dependencies]
orchard = { package = "zakura-orchard", version = "=1.0.1", default-features = false, features = ["std"] }
zcash_note_encryption = "=0.5.1"
serde_json = "1"
hex = "0.4"
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
